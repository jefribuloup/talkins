<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Meja Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

{% include "partials/navbar.html" %}

<main class="dashboard">
  <div class="dashboard-head">
    <h1 data-i18n="dashboard.title">Ruang unggah</h1>
    <p class="lede" data-i18n="dashboard.sub">Setiap file yang kamu unggah dibuatkan salinan kerja di cloud.</p>
  </div>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" hidden>
    <div class="dropzone-grid"></div>
    <div class="dropzone-content">
      <div class="dropzone-plus">+</div>
      <p class="dropzone-title" data-i18n="dashboard.dropzone.title">Tarik file .xlsx ke sini</p>
      <p class="dropzone-sub" data-i18n="dashboard.dropzone.sub">atau klik untuk memilih dari komputer</p>
    </div>
    <p class="dropzone-status" id="dropzoneStatus"></p>
  </div>

  <section class="filelist" id="file-list">
    <h2 data-i18n="dashboard.filelist.title">File kamu di sesi ini</h2>
    <div id="fileListBody" class="filelist-body">
      <p class="filelist-empty" data-i18n="dashboard.filelist.empty">Belum ada file. Upload di atas untuk mulai.</p>
    </div>
  </section>
</main>

{% include "partials/footer.html" %}

<script src="/static/js/preloader.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/router.js"></script>
<script src="/static/js/upload.js"></script>
</body>
</html>
