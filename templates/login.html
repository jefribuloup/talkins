<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="max-upload-mb" content="{{ max_upload_mb }}">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>Masuk / Daftar — Talkins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

{% include "partials/navbar.html" %}

<main class="login-wrap">
  <section class="login-card" id="loginCard" data-next="{{ next_url }}" data-csrf="{{ csrf_token }}" data-client-id="{{ google_client_id }}">
    <h1 data-i18n="login.heading">Masuk atau daftar dengan Google</h1>
    <p class="login-sub" data-i18n="login.sub">Satu ketukan saja. Belum punya akun? Akun dibuat otomatis saat pertama kali masuk.</p>

    <div class="gsi-wrap" id="gsiButton"></div>

    <p class="login-error" id="loginError" role="alert" hidden></p>

    <a class="btn-google" id="googleFallback" href="/auth/google?next={{ next_url|urlencode }}" data-no-router hidden>
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      <span data-i18n="login.google.fallback">Lanjutkan dengan Google</span>
    </a>
  </section>
</main>

{% include "partials/footer.html" %}

<script src="/static/js/http.js"></script>
<script src="/static/js/preloader.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/router.js"></script>
<script>
  // Masuk & daftar satu jalur: Google One Tap. Akun otomatis dibuat bila belum ada.
  (function () {
    var card = document.getElementById("loginCard");
    var errEl = document.getElementById("loginError");
    var btnBox = document.getElementById("gsiButton");
    var fallback = document.getElementById("googleFallback");
    var clientId = card.getAttribute("data-client-id") || "";
    var nextUrl = card.getAttribute("data-next") || "/dashboard";
    var csrf = card.getAttribute("data-csrf") || "";
    var busy = false, loadTimer = null, left = false;

    function tr(key) { return window.MejaDataI18n ? window.MejaDataI18n.t(key) : key; }
    function gid() { return window.google && window.google.accounts && window.google.accounts.id; }

    function showError(code) {
      var key = "login.error." + code, text = tr(key);
      if (text === key) text = tr("login.error.failed");
      errEl.hidden = false;
      errEl.setAttribute("data-i18n", key);
      errEl.textContent = text;
    }

    function goTo(url) {
      if (gid()) gid().cancel();
      if (window.MejaRouter) window.MejaRouter.go(url, { replace: true });
      else window.location.href = url;
    }

    function onCredential(resp) {
      if (busy || !resp || !resp.credential) return;
      busy = true;
      errEl.hidden = true;
      btnBox.style.opacity = "0.5";
      btnBox.style.pointerEvents = "none";
      fetch("/auth/google/onetap", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrf },
        body: JSON.stringify({ credential: resp.credential, next: nextUrl }),
      })
        .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, body: j }; }); })
        .then(function (r) {
          if (r.ok && r.body.redirect) { goTo(r.body.redirect); return; }
          throw r.body.error || "failed";
        })
        .catch(function (e) {
          busy = false;
          btnBox.style.opacity = "";
          btnBox.style.pointerEvents = "";
          showError(typeof e === "string" ? e : "network");
        });
    }

    function startGoogle() {
      if (left || !gid()) return;
      clearTimeout(loadTimer);
      gid().initialize({
        client_id: clientId,
        callback: onCredential,
        auto_select: false,
        cancel_on_tap_outside: false,
        itp_support: true,
        use_fedcm_for_prompt: true,
      });
      gid().renderButton(btnBox, {
        type: "standard", theme: "outline", size: "large", shape: "pill",
        text: "continue_with", logo_alignment: "left",
        width: Math.min(320, Math.max(200, btnBox.clientWidth || 280)),
        locale: (window.MejaDataI18n && window.MejaDataI18n.getLang()) || "id",
      });
      gid().prompt(); // popup One Tap; bila ditutup/ditolak user, tombol di atas tetap bisa dipakai
    }

    function useFallback() {
      if (gid()) return;
      fallback.hidden = false; // GIS terblokir/gagal dimuat -> alur pengalihan OAuth biasa
    }

    // Bersihkan prompt One Tap saat pindah halaman lewat router
    window.addEventListener("mejadata:pageleave", function () {
      left = true;
      if (gid()) gid().cancel();
    }, { once: true });

    if (!clientId) { showError("not_configured"); return; }

    if (gid()) { startGoogle(); return; }
    var s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = startGoogle;
    s.onerror = useFallback;
    document.head.appendChild(s);
    loadTimer = setTimeout(useFallback, 8000);

    var code = new URLSearchParams(window.location.search).get("error");
    if (code) showError(code);
  })();
</script>
</body>
</html>
